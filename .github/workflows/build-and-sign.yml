name: Build and Sign (SignPath)

on:
  push:
    tags: ['v*']          # 打 tag 如 v1.0.6 时自动构建、签名并发布 Release
  workflow_dispatch:      # 也支持手动触发（出未带 Release 的 artifact）

# 创建 Release 需要写仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # tag 发布：把版本号对齐到 tag（去掉前缀 v），并跳过自动 +1
      - name: Align version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.js ${{ github.ref_name }}

      # npm run dist 会：
      #   predist   -> 自动 +1 版本号（tag 构建时因 SKIP_BUMP=1 跳过）
      #   electron-builder -> 打包；若配置了本地 PFX（CSC_B64=PFX 的 base64）则解码为 sign.pfx，
      #                      用原生 CSC 签名主程序与安装包；否则 afterSign/postdist 钩子走 SignPath
      #   postdist  -> 给 setup.exe 签名
      - name: Build & Sign
        run: |
          if ($env:CSC_B64) {
            $b = [Convert]::FromBase64String($env:CSC_B64)
            $p = Join-Path $env:GITHUB_WORKSPACE "sign.pfx"
            [IO.File]::WriteAllBytes($p, $b)
            $env:CSC_LINK = $p
            $env:WIN_CSC_LINK = $p
          }
          npm run dist
        env:
          SKIP_BUMP: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY: test-xiaohuanxiong
          # 本地签名（绕开 SignPath）：CSC_B64 = PFX 的 base64；步骤内解码为 sign.pfx 并设 CSC_LINK/WIN_CSC_LINK。
          # afterSign/postdist 钩子检测到 CSC_LINK 会自动跳过 SignPath。
          CSC_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 可选：若 SignPath 项目要求指定 artifact configuration 的 slug，设此项
          # SIGNPATH_ARTIFACT_CONFIG: executable

      # tag 构建：自动创建 GitHub Release 并上传已签名的安装包
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tag 构建：把对齐后的版本号文件提交回 main，保持仓库版本与 Release 一致
      - name: Sync version files back to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add package.json data.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: 对齐版本号 ${{ github.ref_name }}"
          git push origin HEAD:main

      # 手动触发（非 tag）：仅上传 artifact，不创建 Release
      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: xiaohuanxiong-setup
          path: dist/setup.exe
