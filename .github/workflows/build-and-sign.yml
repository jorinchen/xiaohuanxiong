name: Build and Sign (SignPath)

on:
  push:
    tags: ['v*']          # 打 tag 如 v1.0.6 时自动构建、签名并发布 Release
  workflow_dispatch:      # 也支持手动触发（出未带 Release 的 artifact）

# 创建 Release 需要写仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # tag 发布：把版本号对齐到 tag（去掉前缀 v），并跳过自动 +1
      - name: Align version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.js ${{ github.ref_name }}

      # 本地签名：把 CSC_LINK（PFX 的 base64）解码为真实文件 sign.pfx，
      # 再经 $GITHUB_ENV 把 CSC_LINK / WIN_CSC_LINK 指向该路径（electron-builder 原生 CSC 签名）。
      # 未配置 CSC_LINK 时跳过此步，回退到 SignPath（afterSign/postdist 钩子会自动判断）。
      - name: 准备本地签名证书
        if: ${{ secrets.CSC_LINK != '' }}
        shell: pwsh
        env:
          CSC_PFX_B64: ${{ secrets.CSC_LINK }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CSC_PFX_B64)
          $pfx = Join-Path $env:GITHUB_WORKSPACE "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$pfx"
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_LINK=$pfx"

      # npm run dist 会：
      #   predist   -> 自动 +1 版本号（tag 构建时因 SKIP_BUMP=1 跳过）
      #   electron-builder -> 打包（afterSign 钩子给 PcAsMobile.exe 签名）
      #   postdist  -> 给 setup.exe 签名
      # 签名通过 SignPath 完成，凭据来自仓库 Secrets（未配置则出未签名包）。
      - name: Build & Sign with SignPath
        run: npm run dist
        env:
          SKIP_BUMP: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY: test-xiaohuanxiong
          # 本地签名（绕开 SignPath）：CSC_LINK / WIN_CSC_LINK 由“准备本地签名证书”步骤注入为
          # sign.pfx 文件路径；此处只需提供导出密码。afterSign/postdist 钩子检测到 CSC_LINK 会自动跳过 SignPath
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 可选：若 SignPath 项目要求指定 artifact configuration 的 slug，设此项
          # SIGNPATH_ARTIFACT_CONFIG: executable

      # tag 构建：自动创建 GitHub Release 并上传已签名的安装包
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tag 构建：把对齐后的版本号文件提交回 main，保持仓库版本与 Release 一致
      - name: Sync version files back to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add package.json data.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: 对齐版本号 ${{ github.ref_name }}"
          git push origin HEAD:main

      # 手动触发（非 tag）：仅上传 artifact，不创建 Release
      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: xiaohuanxiong-setup
          path: dist/setup.exe
